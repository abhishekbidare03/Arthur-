<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Arthur">
  <title>Arthur</title>

  <defs>
    <!-- The wordmark's fill: ember at the feet, white-hot at the tips. -->
    <linearGradient id="ink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#991b1b"/>
      <stop offset="28%"  stop-color="#ea580c"/>
      <stop offset="60%"  stop-color="#f59e0b"/>
      <stop offset="86%"  stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <!-- Flame body: transparent at the base so it sits on nothing, and
         transparent at the tip so it dissolves instead of ending. -->
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7f1d1d" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#dc2626" stop-opacity=".70"/>
      <stop offset="58%"  stop-color="#f97316" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#fbbf24" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0"/>
    </linearGradient>

    <!-- Sweeping highlight. Animated by translating the gradient, which is
         cheaper and smoother than animating a clip path across the glyphs. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff7ed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff7ed" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1.4 0; 1.4 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="haze" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One flame silhouette, reused. Base at the origin, tip at -1. -->
    <path id="lick" d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z"/>
  </defs>

  <style>
    .word {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: 7px;
    }
    .tag {
      font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 4.6px;
      fill: #f59e0b;
      opacity: .75;
    }

    /* Flames are scaled from their base, so they stretch upward rather than
       swelling in place — that is what reads as fire instead of a pulse. */
    .lick { transform-box: fill-box; transform-origin: 50% 100%; }
    .f1 { animation: lick1 1.5s  ease-in-out infinite; }
    .f2 { animation: lick2 1.9s  ease-in-out infinite; }
    .f3 { animation: lick3 2.3s  ease-in-out infinite; }

    @keyframes lick1 {
      0%,100% { transform: scale(1,   1);    opacity: .85 }
      30%     { transform: scale(.88, 1.32); opacity: 1   }
      65%     { transform: scale(1.1, .78);  opacity: .6  }
    }
    @keyframes lick2 {
      0%,100% { transform: scale(1.04, .88); opacity: .7  }
      40%     { transform: scale(.9,   1.25); opacity: .95 }
      72%     { transform: scale(1.08, 1.02); opacity: .78 }
    }
    @keyframes lick3 {
      0%,100% { transform: scale(.94, 1.14); opacity: .9  }
      35%     { transform: scale(1.1,  .82);  opacity: .62 }
      70%     { transform: scale(.92, 1.3);  opacity: 1   }
    }

    .ember { animation: rise 3.4s linear infinite; }
    @keyframes rise {
      0%   { transform: translateY(0)     scale(1);   opacity: 0 }
      15%  {                                          opacity: .9 }
      100% { transform: translateY(-74px) scale(.35); opacity: 0 }
    }

    .heat { animation: heat 2.6s ease-in-out infinite; }
    @keyframes heat { 0%,100% { opacity: .32 } 50% { opacity: .6 } }
  </style>

  <!-- Heat haze behind everything ------------------------------------------ -->
  <g filter="url(#haze)" class="heat">
    <ellipse cx="190" cy="86" rx="150" ry="34" fill="#ea580c" opacity=".45"/>
    <ellipse cx="190" cy="70" rx="96"  ry="26" fill="#f59e0b" opacity=".35"/>
  </g>

  <!-- Flames ---------------------------------------------------------------- -->
  <g filter="url(#haze)" opacity=".9">
    <g transform="translate(30,114)  scale(1.05)"><use href="#lick" fill="url(#flame)" class="lick f2"/></g>
    <g transform="translate(66,116)  scale(1.35)"><use href="#lick" fill="url(#flame)" class="lick f1"/></g>
    <g transform="translate(104,113) scale(1.0)" ><use href="#lick" fill="url(#flame)" class="lick f3"/></g>
    <g transform="translate(142,117) scale(1.45)"><use href="#lick" fill="url(#flame)" class="lick f2"/></g>
    <g transform="translate(190,118) scale(1.6)" ><use href="#lick" fill="url(#flame)" class="lick f1"/></g>
    <g transform="translate(238,117) scale(1.4)" ><use href="#lick" fill="url(#flame)" class="lick f3"/></g>
    <g transform="translate(278,113) scale(1.05)"><use href="#lick" fill="url(#flame)" class="lick f2"/></g>
    <g transform="translate(314,116) scale(1.3)" ><use href="#lick" fill="url(#flame)" class="lick f1"/></g>
    <g transform="translate(350,114) scale(1.0)" ><use href="#lick" fill="url(#flame)" class="lick f3"/></g>
  </g>

  <!-- Hot cores, unblurred, so the fire has something solid inside it -------- -->
  <g opacity=".85">
    <g transform="translate(66,114)  scale(.62)"><use href="#lick" fill="url(#core)" class="lick f3"/></g>
    <g transform="translate(190,116) scale(.8)" ><use href="#lick" fill="url(#core)" class="lick f2"/></g>
    <g transform="translate(314,114) scale(.6)" ><use href="#lick" fill="url(#core)" class="lick f1"/></g>
  </g>

  <!-- Embers ---------------------------------------------------------------- -->
  <g fill="#fbbf24">
    <circle class="ember" cx="74"  cy="104" r="2.1" style="animation-delay:0s"/>
    <circle class="ember" cx="128" cy="108" r="1.5" style="animation-delay:-1.1s"/>
    <circle class="ember" cx="196" cy="102" r="2.4" style="animation-delay:-2.2s"/>
    <circle class="ember" cx="252" cy="107" r="1.7" style="animation-delay:-.6s"/>
    <circle class="ember" cx="308" cy="103" r="2.0" style="animation-delay:-1.7s"/>
    <circle class="ember" cx="340" cy="109" r="1.4" style="animation-delay:-2.8s"/>
  </g>

  <!-- Wordmark -------------------------------------------------------------- -->
  <!-- Drawn three times: a blurred hot copy for the bloom, the gradient copy
       outlined in ember red so it holds up on a white page as well as a dark
       one, and the sheen sweeping over the top. -->
  <text class="word" x="190" y="94" text-anchor="middle" fill="#f97316"
        filter="url(#haze)" opacity=".7">ARTHUR</text>

  <g filter="url(#glow)">
    <text class="word" x="190" y="94" text-anchor="middle"
          fill="url(#ink)" stroke="#7f1d1d" stroke-width="1.3"
          paint-order="stroke">ARTHUR</text>
  </g>

  <text class="word" x="190" y="94" text-anchor="middle" fill="url(#sheen)">ARTHUR</text>

  <text class="tag" x="190" y="122" text-anchor="middle">OFFLINE &#183; ON DEVICE</text>
</svg>

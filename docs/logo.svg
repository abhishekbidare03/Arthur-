<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1" viewBox="0 0 380 140" width="380" height="140"
     role="img" aria-label="Arthur">
  <title>Arthur</title>

  <!--
    Written the conservative way on purpose: no <style> block, no CSS classes,
    no <use>. Every colour and font is a presentation attribute and every
    animation is SMIL, because an <img>-embedded SVG is rendered in secure
    static mode and different hosts disagree about what survives that. A
    stripped stylesheet would leave black text on nothing; presentation
    attributes cannot be stripped without stripping the shape itself.
  -->

  <defs>
    <linearGradient id="ink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#991b1b"/>
      <stop offset="28%"  stop-color="#ea580c"/>
      <stop offset="60%"  stop-color="#f59e0b"/>
      <stop offset="86%"  stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7f1d1d" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#dc2626" stop-opacity="0.70"/>
      <stop offset="58%"  stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff7ed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff7ed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1.4 0; 1.4 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="haze" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Heat haze. Scaling happens about the origin, and each flame path has its
       base at y=0, so a plain scale stretches it upward the way fire moves. -->
  <g filter="url(#haze)">
    <animate attributeName="opacity" values="0.32;0.6;0.32" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="190" cy="86" rx="150" ry="34" fill="#ea580c" opacity="0.45"/>
    <ellipse cx="190" cy="70" rx="96"  ry="26" fill="#f59e0b" opacity="0.35"/>
  </g>

  <g filter="url(#haze)" opacity="0.9">
    <g transform="translate(30,114) scale(1.05)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.7">
        <animateTransform attributeName="transform" type="scale"
                          values="1.04 0.88; 0.9 1.25; 1.08 1.02; 1.04 0.88" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.95;0.78;0.7" dur="1.9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(66,116) scale(1.35)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.85">
        <animateTransform attributeName="transform" type="scale"
                          values="1 1; 0.88 1.32; 1.1 0.78; 1 1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;1;0.6;0.85" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(104,113) scale(1.0)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.9">
        <animateTransform attributeName="transform" type="scale"
                          values="0.94 1.14; 1.1 0.82; 0.92 1.3; 0.94 1.14" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.62;1;0.9" dur="2.3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(142,117) scale(1.45)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.7">
        <animateTransform attributeName="transform" type="scale"
                          values="1.04 0.88; 0.9 1.25; 1.08 1.02; 1.04 0.88" dur="1.9s" begin="-0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.95;0.78;0.7" dur="1.9s" begin="-0.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(190,118) scale(1.6)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.85">
        <animateTransform attributeName="transform" type="scale"
                          values="1 1; 0.88 1.32; 1.1 0.78; 1 1" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;1;0.6;0.85" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(238,117) scale(1.4)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.9">
        <animateTransform attributeName="transform" type="scale"
                          values="0.94 1.14; 1.1 0.82; 0.92 1.3; 0.94 1.14" dur="2.3s" begin="-1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.62;1;0.9" dur="2.3s" begin="-1.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(278,113) scale(1.05)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.7">
        <animateTransform attributeName="transform" type="scale"
                          values="1.04 0.88; 0.9 1.25; 1.08 1.02; 1.04 0.88" dur="1.9s" begin="-1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.95;0.78;0.7" dur="1.9s" begin="-1.3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(314,116) scale(1.3)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.85">
        <animateTransform attributeName="transform" type="scale"
                          values="1 1; 0.88 1.32; 1.1 0.78; 1 1" dur="1.5s" begin="-0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;1;0.6;0.85" dur="1.5s" begin="-0.9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(350,114) scale(1.0)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#flame)" opacity="0.9">
        <animateTransform attributeName="transform" type="scale"
                          values="0.94 1.14; 1.1 0.82; 0.92 1.3; 0.94 1.14" dur="2.3s" begin="-1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.62;1;0.9" dur="2.3s" begin="-1.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Hot cores, unblurred, so the fire has something solid inside it. -->
  <g opacity="0.85">
    <g transform="translate(66,114) scale(0.62)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#core)">
        <animateTransform attributeName="transform" type="scale"
                          values="0.94 1.14; 1.1 0.82; 0.92 1.3; 0.94 1.14" dur="2.3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(190,116) scale(0.8)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#core)">
        <animateTransform attributeName="transform" type="scale"
                          values="1.04 0.88; 0.9 1.25; 1.08 1.02; 1.04 0.88" dur="1.9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(314,114) scale(0.6)">
      <path d="M0 0 C-9 -11 -8 -26 0 -44 C8 -26 9 -11 0 0 Z" fill="url(#core)">
        <animateTransform attributeName="transform" type="scale"
                          values="1 1; 0.88 1.32; 1.1 0.78; 1 1" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Embers -->
  <g fill="#fbbf24">
    <circle cx="74" cy="104" r="2.1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -74" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="108" r="1.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -74" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="196" cy="102" r="2.4">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -74" dur="3.4s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="252" cy="107" r="1.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -74" dur="3.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="308" cy="103" r="2.0">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -74" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="109" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -74" dur="3.4s" begin="-2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" begin="-2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark: a blurred hot copy for the bloom, the gradient copy outlined in
       ember red so it holds up on a white page as well as a dark one, then the
       sheen sweeping over the top. -->
  <text x="190" y="94" text-anchor="middle"
        font-family="Palatino Linotype, Book Antiqua, Palatino, Georgia, Times New Roman, serif"
        font-size="58" font-weight="700" letter-spacing="7"
        fill="#f97316" filter="url(#haze)" opacity="0.7">ARTHUR</text>

  <g filter="url(#glow)">
    <text x="190" y="94" text-anchor="middle"
          font-family="Palatino Linotype, Book Antiqua, Palatino, Georgia, Times New Roman, serif"
          font-size="58" font-weight="700" letter-spacing="7"
          fill="url(#ink)" stroke="#7f1d1d" stroke-width="1.3" paint-order="stroke">ARTHUR</text>
  </g>

  <text x="190" y="94" text-anchor="middle"
        font-family="Palatino Linotype, Book Antiqua, Palatino, Georgia, Times New Roman, serif"
        font-size="58" font-weight="700" letter-spacing="7"
        fill="url(#sheen)">ARTHUR</text>

  <text x="190" y="122" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="4.6"
        fill="#f59e0b" opacity="0.75">OFFLINE &#183; ON DEVICE</text>
</svg>
